<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Mô Phỏng Phản Ứng Thuận Nghịch - Hóa Học ABC</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
</head>
<body>
  <div id="app-container">
    <!-- BẢNG ĐIỀU KHIỂN (SIDEBAR) -->
    <div id="sidebar">
      <h2>MÔ PHỎNG PHẢN ỨNG THUẬN NGHỊCH<br><span style="color: #60a5fa; font-size: 0.85em;">HÓA HỌC ABC</span></h2>
      
      <div class="control-group">
        <h3>1. ĐIỀU KHIỂN CHÍNH</h3>
        <div class="btn-row">
          <button id="playBtn" class="control-btn primary">▶ PLAY</button>
          <button id="resetBtn" class="control-btn danger">⟲ RESET</button>
        </div>
      </div>

      <div class="control-group">
        <h3>2. CHẾ ĐỘ PHẢN ỨNG</h3>
        <div class="btn-row">
          <button id="modeReversibleBtn" class="control-btn toggle active">Thuận nghịch</button>
          <button id="modeOneWayBtn" class="control-btn toggle">Một chiều</button>
        </div>
      </div>

      <div class="control-group">
        <h3>3. CHẤT THAM GIA (T=0)</h3>
        <div class="input-row">
          <label>Chất A:</label>
          <input type="number" id="countA" min="0" max="10000" step="100" value="0">
        </div>
        <div class="input-row">
          <label>Chất B:</label>
          <input type="number" id="countB" min="0" max="10000" step="100" value="0">
        </div>
      </div>

      <div class="control-group">
        <h3>4. MÔI TRƯỜNG</h3>
        <div class="slider-row">
          <label>Tốc độ mô phỏng: <span id="speedVal">3.0</span></label>
          <input type="range" id="speedSlider" min="0" max="20" step="0.5" value="3.0">
        </div>
        <div class="slider-row">
          <label>Âm lượng va chạm: <span id="volVal">5</span></label>
          <input type="range" id="volumeSlider" min="0" max="10" step="1" value="5">
        </div>
      </div>

      <div class="control-group">
        <h3>5. CÔNG CỤ HIỂN THỊ</h3>
        <div class="btn-grid">
          <button id="labelBtn" class="control-btn toggle on">🏷 Nhãn: BẬT</button>
          <button id="toggleCountsBtn" class="control-btn toggle on">📊 SL: BẬT</button>
          <button id="concChartBtn" class="control-btn toggle">📈 Nồng độ: TẮT</button>
          <button id="rateChartBtn" class="control-btn toggle">⚡ Tốc độ: TẮT</button>
        </div>
      </div>
    </div>

    <!-- KHU VỰC ĐỒ HỌA 3D VÀ BẢNG THÔNG SỐ -->
    <div id="canvas-holder">
      
      <!-- Bảng số liệu nổi góc trên bên phải -->
      <div id="countsPanel">
        <div class="count-item"><span class="color-box" style="background:#2f6bff"></span> Chất A: <span id="cntA">0</span></div>
        <div class="count-item"><span class="color-box" style="background:#22c55e"></span> Chất B: <span id="cntB">0</span></div>
        <div class="count-item"><span class="color-box" style="background:#d61fd6"></span> Chất C: <span id="cntC">0</span></div>
        <div class="count-item"><span class="color-box" style="background:#ff8c1a"></span> Chất D: <span id="cntD">0</span></div>
      </div>

      <!-- Khu vực chứa 2 Đồ thị (Góc dưới bên trái) -->
      <div class="panels-container">
        <div id="concChartPanel" class="chart-panel hidden">
          <canvas id="concChartCanvas"></canvas>
        </div>
        <div id="rateChartPanel" class="chart-panel hidden">
          <canvas id="rateChartCanvas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
